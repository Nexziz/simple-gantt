name: Release

# Publishes a GitHub release named after the version in manifest.json (e.g. 0.2.0, no "v")
# whenever main gets a version that hasn't been released yet. Bump the version in
# manifest.json, package.json and versions.json, push to main, and the release appears.
on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check for an existing release
        id: existing
        run: |
          if gh release view "${{ steps.version.outputs.value }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.existing.outputs.found == 'false'
        with:
          node-version: 22
      - name: Build
        if: steps.existing.outputs.found == 'false'
        run: |
          npm ci
          npm run build
      - name: Publish release
        if: steps.existing.outputs.found == 'false'
        run: |
          gh release create "${{ steps.version.outputs.value }}" main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.value }}" --generate-notes
